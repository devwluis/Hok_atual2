kind = "web"
previewPath = "/"
title = "Hokma Mobile Chat"
version = "1.0.0"
id = "artifacts/hokma-mobile-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24500

[services.development]
run = "pnpm --filter @workspace/hokma-mobile-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hokma-mobile-chat", "run", "build" ]
publicDir = "artifacts/hokma-mobile-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24500"
BASE_PATH = "/"
